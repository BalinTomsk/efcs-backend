# Local development: Qdrant + news_find. Production placement is not decided yet (docs/specification.md, §12).
#   docker compose up -d qdrant          # just the vector database, then `dotnet run --project NewsFind`
#   docker compose up -d --build         # both (run scripts/fetch-model.ps1 first)
#   docker compose run --rm news_find --sync-full   # index every published article and exit
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0   # keep the minor in step with the Qdrant.Client package; pin by digest for prod
    ports:
      - "127.0.0.1:6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "127.0.0.1:6334:6334"   # gRPC, used by news_find
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 256m

  news_find:
    build: .
    depends_on: [qdrant]
    environment:
      QDRANT_URL: http://qdrant:6334
      DOTENV_PATH: /run/secrets/news_find.env
    volumes:
      - ./.env:/run/secrets/news_find.env:ro
    ports:
      - "127.0.0.1:8095:8080"
    mem_limit: 512m

volumes:
  qdrant-data:
